syntax = "proto3";

package pb; // group multiple proto files of same topic

import "user.proto";

option go_package = "simple-bank/pb";

message UpdateUserRequest {
    string username = 1;
    optional string full_name = 2; // optional sets the value update optional
    optional string email = 3;
    optional string password = 4;
}

message UpdateUserResponse {
    User user = 1;
}